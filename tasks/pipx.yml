- name: Install multiple packages from list
  vars:
    pipx_packages:
      - poetry
      - poethepoet
      - basedpyright
      - tldr
      - "huggingface_hub[cli]"
  community.general.pipx:
    name: "{{ item }}"
    state: latest
    executable: /opt/homebrew/bin/pipx
  with_items: "{{ pipx_packages }}"
